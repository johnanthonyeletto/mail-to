name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing must be set for this exact repo on npm
      - name: Debug – repo identity
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "On npm, Trusted publishing → Workflow filename must be: publish.yml"
          echo "Repository on npm must match: $GITHUB_REPOSITORY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Trusted publishing (OIDC) – no NPM_TOKEN needed. Configure at:
      # npmjs.com → Your package → Settings → Trusted publishing
      - name: Publish to npm
        run: npm publish
